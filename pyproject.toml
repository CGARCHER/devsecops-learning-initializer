[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-learning-initializer"
version = "0.1.0"
description = "Asistente educativo para incorporar controles DevSecOps en proyectos existentes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cipriano García Hernández"}]
dependencies = []

[project.scripts]
devsecops-init = "devsecops_initializer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devsecops_initializer = ["static/*"]

